<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" as="video" href="background.webm" type="video/webm">
<title>RSVP</title>
<style>
:root{--blue:#173263;--blue2:#0f2a58;--text:#0e1d3d;--muted:#5b6575;--max:540px}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--blue);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--blue)}
.bg video{width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(.96)}
.bg::after{content:"";position:absolute;inset:0;background:rgba(16,36,76,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:14px}
.card{width:min(100%,var(--max));background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.24)}
.top{background:linear-gradient(180deg,var(--blue) 0%,var(--blue2) 100%);padding:24px 20px 18px}
.logo{display:flex;justify-content:center;align-items:center;margin:0 auto 16px}
.logo img{display:block;width:min(76%,320px);height:auto;margin:auto}
.rule{border:0;border-top:1px solid rgba(255,255,255,.34);margin:12px 0 14px}
.lang{display:flex;justify-content:center;gap:10px}
.lang button{min-width:52px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.05);color:rgba(255,255,255,.62);font-size:14px;font-weight:700;cursor:pointer}
.lang button.active{background:rgba(255,255,255,.17);color:#fff;border-color:rgba(255,255,255,.32)}
.content{padding:30px 22px 22px}
.event{text-align:center;color:var(--blue);margin-bottom:14px}
.event h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.1;font-weight:800}
.guest{display:none;text-align:center;margin:22px 0 14px;padding:0;background:transparent}
.name{color:var(--blue);font-size:clamp(30px,8vw,44px);line-height:1.08;font-weight:800;overflow-wrap:anywhere}
#eventDetails{margin:16px 0 28px}.date{margin:0;text-align:center;color:var(--text);font-size:19px;line-height:1.55;font-weight:500}
.info{display:none;font-size:16px;line-height:1.65;color:#16213d}.info p{margin:0 0 16px}.info ul{margin:8px 0 20px;padding-left:25px}.info li{margin:7px 0}.warning{font-weight:800;margin-top:18px!important}
.confirm{display:none;width:100%;margin-top:24px;padding:16px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.confirm:disabled{opacity:.72;cursor:default}.message{display:none;margin:16px 0 0;padding:13px 14px;border-radius:12px;text-align:center;line-height:1.45}
.message.error{display:block;color:#8b1e2d;background:#fdecef;border:1px solid #f4c8d0}.message.success{display:block;color:#17643a;background:#eaf7ef;border:1px solid #c5e7d1}.message.notice{display:block;color:var(--blue);background:#edf2fa;border:1px solid #d2dced}
.footer{display:none;margin-top:24px;padding-top:18px;border-top:1px solid rgba(23,50,99,.18);text-align:center;font-size:14px;line-height:1.55;color:var(--muted)}.footer a{display:inline-block;color:#0b55c4;font-weight:650;text-decoration:none;overflow-wrap:anywhere}.loading{text-align:center;color:var(--muted);padding:10px 0 2px}
@media(max-width:380px){.wrap{padding:8px}.top{padding:20px 16px 16px}.logo img{width:82%}.content{padding:24px 16px 18px}.info{font-size:15px}.date{font-size:17px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><video autoplay muted loop playsinline preload="auto"><source src="background.webm" type="video/webm"><source src="background.mp4" type="video/mp4"></video></div>
<main class="wrap"><section class="card">
  <div class="top">
    <div class="logo"><img src="logo.png" alt="Logo"></div>
    <hr class="rule">
    <div class="lang" aria-label="Language"><button type="button" id="langPl" data-lang="pl">PL</button><button type="button" id="langEn" data-lang="en">EN</button></div>
  </div>
  <div class="content">
    <div class="event"><h1 id="eventTitle"></h1></div>
    <div id="loading" class="loading"></div>
    <div id="guest" class="guest"><div id="guestName" class="name"></div></div>
    <div id="eventDetails" class="event"><p class="date" id="eventDate"></p></div>
    <div id="info" class="info">
      <p id="importantText"></p><p><strong id="acceptText"></strong></p>
      <ul><li id="docPassport"></li><li id="docDiplomatic"></li><li id="docChina"></li></ul>
      <p id="notAccepted" class="warning"></p>
    </div>
    <div id="footer" class="footer"><span id="footerText"></span><a href="mailto:beijing.events@msz.gov.pl">beijing.events@msz.gov.pl</a></div>
    <button id="confirmBtn" class="confirm" type="button"></button>
    <div id="result" class="message" role="status" aria-live="polite"></div>
  </div>
</section></main>
<script>
const SUPABASE_URL="https://wzilnnmogeqoomnyhhst.supabase.co";
const SUPABASE_KEY="sb_publishable_G_Tfcw-gtbnAfqR_bNev4Q_P7GZS1SG";
const I={
pl:{title:"Święto Wojska Polskiego",date:"27 sierpnia 2026 r. (czwartek)<br>godz. 18:00",important:"<strong>Ważne!</strong> Każdy gość przed wejściem na wydarzenie musi okazać oryginalny, fizyczny dokument tożsamości. Uzupełnij ten formularz danymi, które znajdują się w dokumencie którym się posłużysz.",accept:"Akceptujemy tylko:",passport:"Paszport",diplomatic:"ID dyplomatyczne",china:"ID wydane przez władze Chińskiej Republiki Ludowej",notAccepted:"Nie będą akceptowane: kopie, skany i zdjęcia w smartfonach.",confirm:"Potwierdzam uczestnictwo",loading:"Sprawdzanie zaproszenia…",saving:"Potwierdzanie…",success:"Dziękujemy. Uczestnictwo zostało potwierdzone.",confirmedBtn:"Potwierdzone",already:"To zaproszenie zostało już potwierdzone.",invalid:"Nieprawidłowy link.",error:"Wystąpił błąd połączenia. Spróbuj ponownie.",footer:"W przypadku jakichkolwiek zmian daj nam znać na "},
en:{title:"Polish Armed Forces Day Reception",date:"Thursday, August 27, 2026 at 18:00",important:"<strong>Important!</strong> Every guest must present an original, physical ID document before entering the event. Complete this form with the data found on your ID.",accept:"We only accept:",passport:"Passport",diplomatic:"Diplomatic ID",china:"ID issued by the authorities of the People's Republic of China",notAccepted:"Copies, scans, and photos on smartphones will not be accepted.",confirm:"I confirm my attendance",loading:"Checking invitation…",saving:"Confirming…",success:"Thank you. Your attendance has been confirmed.",confirmedBtn:"Confirmed",already:"This invitation has already been confirmed.",invalid:"Invalid link.",error:"Connection error. Please try again.",footer:"If you have any changes let us know @ "}
};
const $=id=>document.getElementById(id), token=new URLSearchParams(location.search).get("t");
let lang=(navigator.language||"en").toLowerCase().startsWith("pl")?"pl":"en", state="";
function msg(text,type,s=""){let r=$("result");r.textContent=text;r.className="message "+type;r.dataset.state=s;state=s}
function apply(){let d=I[lang];document.documentElement.lang=lang;document.title=d.title+" – RSVP";$("pl").classList.toggle("active",lang==="pl");$("en").classList.toggle("active",lang==="en");$("title").textContent=d.title;$("date").innerHTML=d.date;$("important").innerHTML=d.important;$("accept").textContent=d.accept;$("passport").textContent=d.passport;$("diplomatic").textContent=d.diplomatic;$("china").textContent=d.china;$("notAccepted").textContent=d.notAccepted;$("confirm").textContent=(state==="success"||state==="already")?d.confirmedBtn:d.confirm;$("footerText").textContent=d.footer;if($("loading").dataset.active==="1")$("loading").textContent=d.loading;if(state==="invalid")msg(d.invalid,"error","invalid");if(state==="already")msg(d.already,"notice","already");if(state==="success")msg(d.success,"success","success");if(state==="error")msg(d.error,"error","error")}
async function rpc(name,payload){let r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(payload)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function check(){let d=I[lang];$("loading").dataset.active="1";$("loading").textContent=d.loading;if(!token){$("loading").style.display="none";msg(d.invalid,"error","invalid");return}try{let data=await rpc("check_invitation",{p_hash:token});if(!Array.isArray(data)||!data.length||!data[0].valid){$("loading").style.display="none";msg(I[lang].invalid,"error","invalid");return}let row=data[0];$("loading").style.display="none";$("loading").dataset.active="0";$("guestName").textContent=[row.first_name,row.last_name].filter(Boolean).join(" ");$("guest").style.display="block";$("info").style.display="block";$("footer").style.display="block";if(row.already_confirmed){$("confirm").style.display="block";$("confirm").disabled=true;$("confirm").textContent=I[lang].confirmedBtn;msg(I[lang].already,"notice","already")}else{$("confirm").style.display="block"}}catch(e){console.error(e);$("loading").style.display="none";msg(I[lang].error,"error","error")}}
$("confirm").addEventListener("click",async()=>{let b=$("confirm");b.disabled=true;b.textContent=I[lang].saving;$("result").className="message";state="";try{let data=await rpc("confirm_invitation",{p_hash:token}),row=Array.isArray(data)?data[0]:null;if(row&&row.success){b.disabled=true;b.textContent=I[lang].confirmedBtn;msg(I[lang].success,"success","success")}else if(row&&row.already_confirmed){b.disabled=true;b.textContent=I[lang].confirmedBtn;msg(I[lang].already,"notice","already")}else{b.style.display="none";msg(I[lang].invalid,"error","invalid")}}catch(e){console.error(e);b.disabled=false;b.textContent=I[lang].confirm;msg(I[lang].error,"error","error")}});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;apply()}));
apply();check();
</script>
</body></html>
