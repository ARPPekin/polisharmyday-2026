<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potwierdzenie zaproszenia</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f2;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 30px;
    }

    p {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 999px;
      background: #eef7ee;
      color: #28632d;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Potwierdzenie zaproszenia</h1>
    <p>
      Strona działa poprawnie. To jest wersja startowa naszego systemu RSVP.
    </p>
    <div class="status">✓ Cloudflare Pages działa</div>
  </main>
</body>
</html>
